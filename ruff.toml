# Keep local checks and CI on the same stable rule/formatter release.
required-version = "==0.17.6"
target-version = "py310"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["geoharmony"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
