name: SPLASH smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      EXPECTED_PYTHON: ${{ matrix.python-version }}
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Derive the environment for this interpreter
        run: |
          python3 scripts/ci_environment.py \
            --python-version "$EXPECTED_PYTHON" \
            --output .ci-environment.yml
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: splash
          environment-file: .ci-environment.yml
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false
      - name: Verify the running interpreter
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import os, sys; expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split("."))); assert sys.version_info[:2] == expected, (sys.version, expected); print(sys.version)'
      - name: Build and install SPLASH
        run: |
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir "$RUNNER_TEMP/splash-wheel" .
          python -m pip install --no-deps "$RUNNER_TEMP"/splash-wheel/*.whl
      - name: Verify dependencies and installed entry points
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip check
          python -c 'import geoharmony, os; from pathlib import Path; assert not Path(geoharmony.__file__).resolve().is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve()), geoharmony.__file__; print(geoharmony.__file__)'
          geoharmony-splash --help
          python -m geoharmony --help
      - name: Run tests against the installed package
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Exercise the complete synthetic workflow
        working-directory: ${{ runner.temp }}
        run: geoharmony-splash demo --output-dir "$RUNNER_TEMP/splash-demo"
